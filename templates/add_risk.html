{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Add New Risk</h2>

<form method="POST">

<div class="mb-3">
<label>Risk Name</label>
<input
type="text"
name="risk_name"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Owner</label>
<input
type="text"
name="owner"
class="form-control"
required>
</div>

<div class="mb-3">

<label>Severity</label>

<select
name="severity"
class="form-select">

<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>

</select>

</div>

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-select">

<option>Open</option>
<option>In Progress</option>
<option>Closed</option>

</select>

</div>

<div class="mb-3">

<label>Probability</label>

<select
name="probability"
class="form-select">

<option>Low</option>

<option>Medium</option>

<option>High</option>

</select>

</div>

<div class="mb-3">

<label>Impact</label>

<select
name="impact"
class="form-select">

<option>Low</option>

<option>Medium</option>

<option>High</option>

</select>

</div>

<button class="btn btn-success">

Save Risk

</button>

</form>

{% endblock %}
